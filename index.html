<script>
// ---------- Persistencia (localStorage con respaldo en memoria) ----------
let S={done:{},ok:0,ko:0,fails:[],seen:{},cards:{},last:null,pref:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('so3u3')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('so3u3',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),M=$('#m');
const fix=t=>`<p class="card fix"><b>Corrección sobre el PDF original:</b> ${t}</p>`;
const def=t=>`<p class="card def">${t}</p>`;

// ---------- Contenido: temario ----------
const T=[
{id:'so',t:'1. Sistema informático y sistema operativo',h:`
${def('<b>Sistema operativo (SO):</b> software base que administra los recursos del hardware (CPU, memoria, almacenamiento, E/S) y ofrece servicios a las aplicaciones. Actúa de intermediario entre usuario, aplicaciones y hardware.')}
<p>Un sistema informático = <b>hardware</b> (componentes físicos) + <b>software</b> (programas y datos). El software de sistema incluye el SO, los controladores (drivers) y las utilidades. El hardware se clasifica en componentes básicos, periféricos y puertos.</p>
<p><b>Arquitectura básica:</b> CPU (unidad de control, UAL y registros), memoria y sistema de E/S, conectados por buses.</p>
<p><b>Arranque:</b> corriente → BIOS/UEFI → POST (comprueba el hardware) → búsqueda del sector de arranque (MBR) → gestor de arranque → carga del SO.</p>
<p><b>Capas y modos:</b> solo el <b>núcleo (kernel)</b> habla directamente con el hardware. En <b>modo kernel</b> (privilegiado) las instrucciones acceden a todo el hardware; las aplicaciones corren en <b>modo usuario</b> sin acceso directo. El kernel decide qué aplicación usa un dispositivo y durante cuánto tiempo.</p>
<p><b>Funciones:</b> gestión de procesos, de memoria, de E/S, de archivos y seguridad lógica (más usuarios y control de errores).</p>
<p><b>Interfaz:</b> gráfica (ventanas) o de órdenes (intérprete de comandos, p. ej. <code>cmd</code>).</p>
<p><b>Resumen:</b> el SO administra recursos; el kernel es lo único que toca el hardware; modo kernel ≠ modo usuario.</p>`},
{id:'tipos',t:'2. Tipos de sistemas operativos',h:`
<div class="wrap"><table><tr><th>Criterio</th><th>Tipos</th></tr>
<tr><td>Forma de explotación</td><td><b>Por lotes</b> (trabajos secuenciales, sin interacción), <b>interactivos</b>, <b>tiempo compartido</b>, <b>tiempo real</b></td></tr>
<tr><td>Usuarios</td><td>Monousuario / multiusuario</td></tr>
<tr><td>Programas a la vez</td><td>Monoprogramación / multiprogramación</td></tr>
<tr><td>Procesadores</td><td>Monoproceso / multiproceso (simétrico o asimétrico)</td></tr>
<tr><td>Red</td><td>Centralizados / en red / distribuidos</td></tr></table></div>
${def('<b>Tiempo compartido:</b> la CPU reparte su tiempo en turnos para que cada usuario o proceso tenga sensación de uso exclusivo. <b>Tiempo real:</b> el SO debe garantizar que ciertas tareas cumplen <i>plazos</i> (restricciones temporales).')}
${fix('el PDF presenta “procesos en tiempo real” como sinónimo de multitarea. No lo es: multitarea o tiempo compartido reparten la CPU; tiempo real exige <b>cumplir plazos</b> (control industrial, médico, frenos…). Un SO de escritorio es multitarea pero no de tiempo real.')}
<p><b>Resumen:</b> lotes = sin interacción; interactivo = respuesta rápida; compartido = turnos; real = plazos garantizados.</p>`},
{id:'arq',t:'3. Arquitecturas del sistema operativo',h:`
<p><b>Monolítica:</b> los servicios principales del núcleo (procesos, memoria, archivos, E/S) se ejecutan juntos en <b>espacio de kernel</b>. Rápida, pero un fallo en un componente puede afectar a todo el sistema.</p>
<p><b>En capas:</b> cada nivel tiene una función definida y solo se comunica con el inmediato superior e inferior.</p>
<p><b>Cliente-servidor (microkernel):</b> los servicios son procesos servidores que atienden a procesos clientes; el núcleo se reduce al mínimo.</p>
<p><b>Máquina virtual:</b> software que presenta una máquina que parece una máquina real (hardware virtualizado), donde se puede ejecutar un SO invitado.</p>
${fix('el PDF define el monolítico como “no estructurado”. Sí tiene organización y puede ser modular; lo característico es que los servicios corren en espacio de kernel. Además, afirma que las máquinas virtuales “deben ser multitarea”: no es una condición de definición; una máquina virtual no es lo mismo que un proceso ni que un SO.')}`},
{id:'proc',t:'4. Procesos, hilos y estados',h:`
${def('<b>Proceso:</b> programa en ejecución. Un programa es un archivo en memoria secundaria; un proceso vive en memoria principal con su espacio de direcciones.')}
<p><b>BCP (Bloque de Control de Proceso):</b> estructura del SO por proceso: PID, estado, prioridad, ubicación en memoria (y, en general, el contexto de CPU).</p>
<p><b>Estados:</b> <b>nuevo</b>, <b>preparado</b> (listo, espera CPU), <b>en ejecución</b>, <b>bloqueado</b> (espera un evento o E/S) y <b>terminado</b>.</p>
<div class="wrap"><table><tr><th>Transición</th><th>Cuándo</th></tr>
<tr><td>Preparado → Ejecución</td><td>el planificador le asigna la CPU</td></tr>
<tr><td>Ejecución → Preparado</td><td>agota su tiempo o es expulsado</td></tr>
<tr><td>Ejecución → Bloqueado</td><td>necesita un recurso o E/S</td></tr>
<tr><td>Bloqueado → Preparado</td><td>llega el evento esperado</td></tr></table></div>
<p><b>Hilo (hebra):</b> unidad de ejecución dentro de un proceso. Los hilos de un proceso comparten el espacio de direcciones y recursos (memoria, archivos abiertos); cada hilo tiene sus propios <b>registros y pila</b>.</p>
${fix('el PDF explica que cada documento de Word es una hebra. Documentos, ventanas o archivos abiertos <b>no son hilos por definición</b>: una aplicación puede crear hilos para cualquier tarea (interfaz, guardado, red) o ninguno. Un proceso tiene uno o varios hilos.')}
<p><b>Planificador:</b> decide qué proceso preparado usa la CPU. <b>Cambio de contexto:</b> guardar el estado del proceso saliente y cargar el del entrante (debe ser muy rápido). <b>Envejecimiento:</b> la prioridad de un proceso que espera sube con el tiempo para evitar que nunca se ejecute.</p>`},
{id:'plan',t:'5. Planificación y tiempos',h:`
<div class="wrap"><table><tr><th>Medida</th><th>Fórmula</th></tr>
<tr><td>Tiempo de llegada</td><td>instante en que el proceso entra en el sistema</td></tr>
<tr><td>Tiempo de ejecución (ráfaga)</td><td>CPU que necesita</td></tr>
<tr><td>Tiempo de retorno</td><td>fin − llegada</td></tr>
<tr><td>Tiempo de espera</td><td>retorno − ejecución (tiempo en cola de preparados)</td></tr>
<tr><td>Tiempo de respuesta</td><td>primera vez en CPU − llegada</td></tr></table></div>
<p><b>Ejemplo:</b> llega en 2, necesita 4 de CPU, empieza en 5 y termina en 11 sin bloqueos → respuesta 5−2=3; retorno 11−2=9; espera 9−4=5.</p>
${fix('el PDF define el “tiempo de respuesta” como el tiempo hasta que el proceso <b>termina</b>. Eso es el tiempo de <b>retorno</b>. El de respuesta llega solo hasta la primera ejecución. Tampoco cuenta como espera el tiempo bloqueado: solo el de la cola de preparados.')}
<p><b>Algoritmos:</b> <b>FCFS</b> (por orden de llegada), <b>SJF</b> (el más corto primero), <b>Round Robin</b> (turnos de un quantum). El temario no los desarrolla: están añadidos para practicar en el Laboratorio.</p>`},
{id:'mem',t:'6. Gestión de memoria',h:`
<p>El gestor de memoria asigna RAM a los procesos. Requisitos: <b>protección</b> (un proceso no accede a la memoria de otro; el procesador intercepta accesos no permitidos), <b>reubicación</b> (direcciones lógicas traducidas por hardware y SO) y <b>compartición</b> controlada (p. ej. DLL).</p>
<div class="wrap"><table><tr><th>Esquema</th><th>Idea</th><th>Problema</th></tr>
<tr><td>Un solo proceso</td><td>monitor del SO + un proceso</td><td>solo uno a la vez</td></tr>
<tr><td>Particiones fijas</td><td>tamaños prefijados</td><td>procesos pequeños desperdician partición; pocos procesos activos</td></tr>
<tr><td>Particiones variables</td><td>se asigna justo lo necesario</td><td>huecos dispersos; se corrige con <b>compactación</b></td></tr>
<tr><td>Paginación</td><td>páginas de tamaño fijo en marcos del mismo tamaño, no contiguos</td><td>fragmentación interna en la última página</td></tr>
<tr><td>Segmentación</td><td>segmentos lógicos de tamaño variable (código, datos, pila)</td><td>puede haber fragmentación externa</td></tr></table></div>
<p><b>Intercambio (swapping):</b> mover a disco procesos bloqueados para dar cabida a otros. <b>Registro límite:</b> protege la partición.</p>
${def('<b>Fragmentación interna:</b> memoria reservada pero no usada <i>dentro</i> de un bloque asignado. <b>Externa:</b> huecos libres sueltos que, por separado, no caben a un proceso.')}
${fix('el PDF dice que la paginación “acaba con la fragmentación”. Elimina la <b>externa</b>, pero produce <b>interna</b>: un proceso de 10 KB con páginas de 4 KB usa 3 marcos (12 KB) y desperdicia 2 KB. La combinación paginación+segmentación divide cada segmento en páginas.')}`},
{id:'vm',t:'7. Memoria virtual',h:`
${def('<b>Memoria virtual:</b> técnica que da a cada proceso un espacio de direcciones virtual propio. Solo las páginas necesarias residen en memoria física; las demás permanecen en disco (páginas no residentes). Permite ejecutar procesos mayores que la RAM y tener más procesos cargados.')}
<p><b>Fallo de página:</b> el proceso referencia una página no residente. El SO busca un marco libre y carga la página; si no hay, un <b>algoritmo de sustitución</b> elige una página víctima. Mientras tanto, el proceso queda <b>bloqueado</b>.</p>
<p><b>Hiperpaginación (thrashing):</b> demasiados fallos de página → multiplica los accesos a disco y el rendimiento se desploma. En Linux se usa la partición <code>swap</code>; en Windows, el archivo de paginación.</p>
${fix('el PDF la resume como “usar el disco duro como si fuera RAM”. Es una simplificación: lo esencial es la <b>traducción de direcciones virtuales a físicas</b> y la carga bajo demanda de páginas; el disco es solo el respaldo de las no residentes.')}`},
{id:'es',t:'8. Entrada/salida',h:`
<p><b>Objetivos:</b> independencia del dispositivo, manejo de errores, control de interrupciones y acceso concurrente (discos compartibles; impresoras de uso exclusivo). El <b>driver</b> conoce los detalles de cada dispositivo.</p>
<p><b>Interrupción:</b> señal de hardware que reclama atención; la CPU ejecuta una rutina de atención. Mientras un proceso espera E/S pasa a Bloqueado; al terminar, la interrupción lo pone en Preparado.</p>
${def('<b>DMA:</b> la CPU configura e inicia la transferencia y el controlador DMA mueve los datos entre dispositivo y memoria sin que la CPU gestione cada dato; avisa con una interrupción al terminar.')}
<p><b>Caching:</b> guardar en caché los datos más usados o adyacentes. <b>Buffering:</b> zona intermedia entre periférico y ordenador. <b>Spooling:</b> cola de salida que simultanea E/S y ejecución (p. ej. impresión). <b>Journaling:</b> registro de cambios del sistema de archivos para recuperarlo tras un fallo.</p>
${fix('el PDF dice que con DMA el procesador no tiene que dedicarse a ello. La CPU sigue iniciando la transferencia y recibe la interrupción final; lo que evita es gestionar cada dato.')}`}
];

// ---------- Glosario (también alimenta las tarjetas) ----------
const G=[
['Sistema operativo','so','Software base que administra los recursos del hardware y da servicios a las aplicaciones.'],
['Kernel (núcleo)','so','Parte del SO que corre en modo privilegiado y accede directamente al hardware.'],
['Modo kernel / modo usuario','so','Modo privilegiado con acceso total al hardware / modo restringido de las aplicaciones.'],
['BIOS/UEFI','so','Firmware inicial que ejecuta el POST y localiza el arranque.'],
['Driver (controlador)','es','Programa que permite al SO manejar un dispositivo concreto.'],
['Procesamiento por lotes','tipos','Trabajos ejecutados uno tras otro, sin interacción del usuario.'],
['Tiempo compartido','tipos','Reparto de CPU en turnos para que cada proceso parezca tener el equipo para sí.'],
['Tiempo real','tipos','SO con restricciones temporales: debe cumplir plazos.'],
['Multiprogramación','tipos','Varios programas cargados y alternándose en la CPU.'],
['Multiproceso','tipos','Uso de más de un procesador a la vez (simétrico o asimétrico).'],
['Arquitectura monolítica','arq','Servicios principales del núcleo juntos en espacio de kernel.'],
['Cliente-servidor','arq','Servicios como procesos servidores que atienden a procesos clientes.'],
['Máquina virtual','arq','Software que presenta una máquina que simula hardware real.'],
['Proceso','proc','Programa en ejecución con su espacio de direcciones.'],
['BCP','proc','Estructura del SO con PID, estado, prioridad y ubicación del proceso.'],
['Hilo (hebra)','proc','Unidad de ejecución dentro de un proceso; comparte espacio de direcciones, con registros y pila propios.'],
['Planificador','plan','Decide qué proceso preparado usa la CPU.'],
['Cambio de contexto','plan','Guardar el estado del proceso saliente y cargar el del entrante.'],
['Envejecimiento','plan','La prioridad de un proceso que espera aumenta con el tiempo.'],
['Tiempo de retorno','plan','Fin − llegada.'],
['Tiempo de espera','plan','Retorno − ejecución: tiempo en cola de preparados.'],
['Tiempo de respuesta','plan','Primera ejecución − llegada.'],
['Protección de memoria','mem','Evita que un proceso acceda a memoria ajena.'],
['Reubicación','mem','Un proceso puede cargarse en distinta zona gracias a las direcciones lógicas.'],
['Intercambio (swapping)','mem','Mover procesos entre memoria principal y secundaria.'],
['Compactación','mem','Juntar los bloques ocupados para unir los huecos libres.'],
['Fragmentación interna','mem','Memoria desperdiciada dentro de un bloque asignado.'],
['Fragmentación externa','mem','Huecos libres dispersos que no caben a un proceso.'],
['Paginación','mem','División en páginas y marcos del mismo tamaño, sin contigüidad.'],
['Segmentación','mem','División en segmentos lógicos de tamaño variable.'],
['Memoria virtual','vm','Espacio de direcciones virtual; solo parte de las páginas está en RAM.'],
['Fallo de página','vm','Acceso a una página no residente; el proceso se bloquea hasta cargarla.'],
['Hiperpaginación','vm','Exceso de fallos de página que degrada el rendimiento.'],
['Interrupción','es','Señal de hardware que reclama la atención de la CPU.'],
['DMA','es','Transferencia dispositivo-memoria gestionada por un controlador, iniciada por la CPU.'],
['Caching','es','Guardar en caché los datos más usados.'],
['Buffering','es','Zona de memoria intermedia entre periférico y ordenador.'],
['Spooling','es','Cola que simultanea la E/S con la ejecución.'],
['Journaling','es','Registro de cambios del sistema de archivos para recuperarlo tras fallos.']
];

// ---------- Banco de preguntas: [tema, enunciado, opciones, correcta, explicación] ----------
const VF=['Verdadero','Falso'];
const Q=[
['plan','Un proceso llega en t=2, empieza a ejecutarse en t=5 y termina en t=11. ¿Cuál es su tiempo de respuesta?',['3','9','6','5'],0,'Respuesta = primera ejecución − llegada = 5 − 2 = 3. El 9 sería el retorno.'],
['plan','Mismo proceso (llegada 2, fin 11) con 4 unidades de CPU y sin bloqueos. ¿Tiempo de espera?',['5','9','7','3'],0,'Retorno = 11 − 2 = 9; espera = retorno − ejecución = 9 − 4 = 5.'],
['plan','El tiempo de retorno se mide desde…',['la llegada hasta la finalización','la llegada hasta la primera ejecución','la primera ejecución hasta el fin','el inicio del bloqueo hasta el fin'],0,'Retorno = fin − llegada. Hasta la primera ejecución es la respuesta.'],
['mem','Verdadero o falso: la paginación elimina toda la fragmentación.',VF,1,'Elimina la externa, pero la última página de cada proceso puede dejar fragmentación interna.'],
['mem','Un proceso de 10 KB se carga con páginas de 4 KB. ¿Cuánta fragmentación interna hay?',['2 KB','0 KB','4 KB','6 KB'],0,'Necesita 3 páginas (12 KB) y usa 10 KB: sobran 2 KB.'],
['mem','¿Qué esquema sufre fragmentación externa y la corrige con compactación?',['Particiones variables','Paginación pura','Un solo proceso','Particiones fijas'],0,'Las asignaciones y liberaciones dejan huecos dispersos; la compactación los une.'],
['proc','Verdadero o falso: cada documento abierto en un programa es siempre un hilo.',VF,1,'Documentos y ventanas no son hilos por definición; la aplicación decide si usa hilos.'],
['proc','Los hilos de un mismo proceso NO comparten…',['la pila y los registros','el espacio de direcciones','los archivos abiertos','el código'],0,'Cada hilo tiene su propio contexto de ejecución (registros y pila).'],
['proc','Un proceso en ejecución solicita una lectura de disco. Pasa a…',['Bloqueado','Preparado','Terminado','Nuevo'],0,'Espera un evento de E/S; al llegar la interrupción pasará a Preparado.'],
['arq','¿Qué caracteriza a una arquitectura monolítica?',['Servicios principales del núcleo en espacio de kernel','No tiene ninguna organización interna','Todos los servicios son procesos de usuario','Usa una máquina virtual por proceso'],0,'Puede ser modular, pero los servicios corren juntos en espacio de kernel.'],
['arq','Verdadero o falso: una máquina virtual debe ser multitarea por definición.',VF,1,'Es una máquina simulada; que ejecute varias tareas depende del SO invitado.'],
['vm','¿Qué ocurre ante un fallo de página?',['El proceso se bloquea mientras se carga la página','El proceso termina','Se reinicia el equipo','Se compacta la memoria'],0,'La página no residente se carga en un marco; el proceso espera bloqueado.'],
['vm','Verdadero o falso: la memoria virtual es solo usar el disco como si fuera RAM.',VF,1,'Se basa en espacios de direcciones virtuales traducidos a físicos y páginas residentes o no.'],
['es','¿Qué hace la CPU cuando se usa DMA?',['Inicia la transferencia y recibe aviso al terminar','Nada en ningún momento','Copia cada dato','Apaga el dispositivo'],0,'Configura la operación; el DMA mueve los datos y avisa con una interrupción.'],
['tipos','¿Qué distingue a un SO de tiempo real?',['Cumplir plazos garantizados','Ejecutar muchos procesos','Tener interfaz gráfica','Ser multiusuario'],0,'Tiempo real = restricciones temporales; multitarea o tiempo compartido son otra cosa.'],
['so','Las aplicaciones de usuario se ejecutan en…',['modo usuario','modo kernel','el firmware UEFI','el modo supervisor'],0,'Solo el kernel usa el modo privilegiado, con acceso directo al hardware.']
];

// ---------- Utilidades ----------
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const tn=id=>T.find(x=>x.id==id).t;
function nav(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v))}
function show(v,a){nav(v);M.scrollTop=0;scrollTo(0,0);({home,tema,resumen,test,cards,lab,gl})[v](a)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
$('#gs').oninput=e=>{if(e.target.value.trim())show('gl',e.target.value)};

// ---------- Inicio ----------
function home(){
const n=Object.keys(S.done).filter(k=>S.done[k]).length,p=Math.round(n/T.length*100),tot=S.ok+S.ko;
M.innerHTML=`<h2>Sistemas Operativos — Unidad 3</h2><p class="sub">Herramienta de estudio basada en tus tres PDFs, con correcciones señaladas.</p>
<div class="card"><div class="row" style="justify-content:space-between"><b>Temario completado</b><span class="big">${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div>
<p class="sub" style="margin:10px 0 0">${S.last?'Última sesión: '+new Date(S.last.d).toLocaleString('es-ES')+' · '+tn(S.last.t):'Aún no has empezado.'}</p>
<p style="margin:12px 0 0"><button class="pri" onclick="tema('${S.last?S.last.t:T[0].id}')">Continuar estudiando</button></p></div>
<div class="grid"><div class="card"><div class="big" style="color:var(--ok)">${S.ok}</div>Preguntas acertadas</div><div class="card"><div class="big" style="color:var(--ko)">${S.ko}</div>Falladas${tot?' · '+Math.round(S.ok/tot*100)+'% de acierto':''}</div></div>
<div class="card"><b>Pendientes de estudiar</b><p>${T.filter(x=>!S.done[x.id]).map(x=>`<a href="#" style="color:#a78bfa" onclick="tema('${x.id}');return false">${x.t}</a>`).join('<br>')||'¡Todo el temario marcado como estudiado!'}</p></div>
<div class="row"><button onclick="resetP()">Reiniciar progreso</button>${S.fails.length?'<button onclick="startTest(true)">Repetir '+S.fails.length+' falladas</button>':''}</div>`}
function resetP(){if(confirm('¿Seguro? Se borrarán progreso, resultados y tarjetas.')){S={done:{},ok:0,ko:0,fails:[],seen:{},cards:{},last:null,pref:{}};save();home()}}

// ---------- Temario ----------
function tema(open){nav('tema');
M.innerHTML=`<h2>Temario</h2><p class="sub">Los recuadros ámbar indican imprecisiones del PDF original y su corrección.</p>`+T.map(x=>`<details id="d-${x.id}" ${open==x.id?'open':''}><summary>${x.t}${S.done[x.id]?' ✓':''}</summary><div class="body">${x.h}<p><label><input type="checkbox" ${S.done[x.id]?'checked':''} onchange="mark('${x.id}',this.checked)"> Marcar como estudiado</label></p></div></details>`).join('');
if(open){S.last={t:open,d:Date.now()};save();$('#d-'+open).scrollIntoView()}
document.querySelectorAll('details').forEach(d=>d.ontoggle=()=>{if(d.open){S.last={t:d.id.slice(2),d:Date.now()};save()}})}
function mark(id,v){S.done[id]=v;save()}

// ---------- Resumen ----------
function resumen(){
M.innerHTML=`<h2>Resumen</h2><p class="sub">Para repasar rápido. Definiciones clave por tema.</p>`+T.map(x=>`<div class="card"><h3>${x.t}</h3>`+G.filter(g=>g[1]==x.id).map(g=>`<p style="margin:4px 0"><b>${g[0]}:</b> ${g[2]}</p>`).join('')+`</div>`).join('')+
`<div class="card warn"><b>Confusiones típicas</b><p>Respuesta ≠ retorno · Paginación: interna sí, externa no · Hilo ≠ documento · Tiempo real ≠ multitarea · DMA: la CPU inicia · Virtual ≠ “disco como RAM”.</p></div>`}

// ---------- Test ----------
let TS=null;
function test(){
M.innerHTML=`<h2>Test y simulacros</h2><p class="sub">Banco de ${Q.length} preguntas (test y verdadero/falso).</p><div class="card">
<div class="row"><label>Modo <select id="tm"><option value="p">Práctica (feedback inmediato)</option><option value="e">Examen (resultados al final)</option></select></label>
<label>Preguntas <input id="tn" type="number" min="1" max="${Q.length}" value="10" style="width:70px"></label></div>
<p>Temas:</p><div class="row">${T.map(x=>`<label><input type="checkbox" class="tt" value="${x.id}" checked> ${x.t.slice(3)}</label>`).join('')}</div>
<p><button class="pri" onclick="startTest()">Empezar</button> ${S.fails.length?'<button onclick="startTest(true)">Repetir falladas ('+S.fails.length+')</button>':''}</p></div>`}
function startTest(f){
let pool,mode='p',n=10;
if(f){pool=Q.map((q,i)=>i).filter(i=>S.fails.includes(i));n=pool.length}
else{mode=$('#tm').value;n=+$('#tn').value||10;const ts=[...document.querySelectorAll('.tt:checked')].map(c=>c.value);pool=Q.map((q,i)=>i).filter(i=>ts.includes(Q[i][0]))}
if(!pool.length)return alert('Selecciona al menos un tema con preguntas.');
pool=sh(pool).sort((a,b)=>(S.seen[a]||0)-(S.seen[b]||0)).slice(0,n);
TS={mode,ids:sh(pool),i:0,ans:[],ord:{}};pool.forEach(i=>TS.ord[i]=sh(Q[i][2].map((o,k)=>k)));ask()}
function ask(){
const id=TS.ids[TS.i],q=Q[id],o=Q[id][2].length==2?[0,1]:TS.ord[id];
M.innerHTML=`<h2>Pregunta ${TS.i+1} de ${TS.ids.length}</h2><div class="bar"><i style="width:${TS.i/TS.ids.length*100}%"></i></div>
<div class="card"><p><b>${q[1]}</b></p>${o.map(k=>`<button class="opt" onclick="pick(${k})">${q[2][k]}</button>`).join('')}<div id="fb"></div></div>`}
function pick(k){
const id=TS.ids[TS.i],q=Q[id],good=k==q[3];TS.ans[TS.i]=k;
if(TS.mode=='e'){nextQ();return}
document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const t=b.textContent;if(t==q[2][q[3]])b.classList.add('ok');else if(t==q[2][k])b.classList.add('ko')});
$('#fb').innerHTML=`<p class="card ${good?'def':'warn'}"><b>${good?'Correcto.':'Incorrecto.'}</b> ${q[4]}</p><button class="pri" onclick="nextQ()">Siguiente</button>`}
function nextQ(){TS.i++;TS.i<TS.ids.length?ask():finish()}
function finish(){
let ok=0;TS.ids.forEach((id,j)=>{S.seen[id]=(S.seen[id]||0)+1;if(TS.ans[j]==Q[id][3]){ok++;S.ok++;S.fails=S.fails.filter(x=>x!=id)}else{S.ko++;if(!S.fails.includes(id))S.fails.push(id)}});save();
const n=TS.ids.length;
M.innerHTML=`<h2>Resultado</h2><div class="card"><div class="big">${(ok/n*10).toFixed(1)} / 10</div>${ok} aciertos, ${n-ok} errores · ${Math.round(ok/n*100)}%</div>`+TS.ids.map((id,j)=>{const q=Q[id],g=TS.ans[j]==q[3];return`<div class="card ${g?'def':'warn'}"><b>${q[1]}</b><p>Tu respuesta: ${q[2][TS.ans[j]]} ${g?'✓':'✗'}${g?'':'<br>Correcta: '+q[2][q[3]]}</p><p class="sub" style="margin:0">${q[4]}</p></div>`}).join('')+`<button class="pri" onclick="test()">Nuevo test</button> ${S.fails.length?'<button onclick="startTest(true)">Repetir falladas</button>':''}`}

// ---------- Tarjetas ----------
let CD=null;
function cards(){
M.innerHTML=`<h2>Tarjetas de memoria</h2><p class="sub">Las difíciles aparecen más a menudo.</p><div class="row"><label>Tema <select id="cf"><option value="">Todos</option>${T.map(x=>`<option value="${x.id}">${x.t}</option>`).join('')}</select></label><button onclick="deck()">Barajar y empezar</button></div><div id="cb"></div>`;deck()}
function deck(){
const f=$('#cf').value,w={d:3,n:2,e:1};let d=[];
G.forEach((g,i)=>{if(f&&g[1]!=f)return;const k=w[S.cards[i]]||3;for(let j=0;j<k;j++)d.push(i)});
CD=sh(d);cardShow(false)}
function cardShow(r){
if(!CD.length)return $('#cb').innerHTML='<p class="card">No hay tarjetas para este tema.</p>';
const i=CD[0],g=G[i];
$('#cb').innerHTML=`<div class="card flip" tabindex="0" role="button" onclick="cardShow(${!r})" onkeydown="if(event.key=='Enter'||event.key==' '){event.preventDefault();cardShow(${!r})}">${r?g[2]:'<b>'+g[0]+'</b>'}</div>
${r?`<div class="row"><button onclick="rate('e')">Fácil</button><button onclick="rate('n')">Normal</button><button onclick="rate('d')">Difícil</button></div>`:'<p class="sub">Pulsa la tarjeta para revelar.</p>'}`}
function rate(x){const i=CD[0];S.cards[i]=x;save();CD=CD.filter(k=>k!=i);if(!CD.length)return deck();cardShow(false)}

// ---------- Laboratorio ----------
function lab(){
M.innerHTML=`<h2>Laboratorio</h2><p class="sub">Simulaciones interactivas.</p>
<div class="card"><h3>Estados de un proceso</h3><div class="row" id="stt"></div><div class="row" id="stb" style="margin-top:10px"></div></div>
<div class="card"><h3>Planificación de CPU</h3><p class="sub">Un proceso por línea: nombre, llegada, ejecución.</p>
<div class="row"><textarea id="ps" rows="5" cols="14">A,0,5
B,1,3
C,2,8
D,3,2</textarea><div><label>Algoritmo <select id="al"><option>FCFS</option><option>SJF</option><option>RR</option></select></label><br><label>Quantum <input id="qu" type="number" min="1" value="3" style="width:70px"></label><br><button class="pri" onclick="runS()" style="margin-top:8px">Simular</button></div></div><div id="so"></div></div>
<div class="card"><h3>Paginación y fragmentación interna</h3><div class="row"><label>Proceso (KB) <input id="pz" type="number" min="1" value="10" style="width:80px"></label><label>Página (KB) <input id="pg" type="number" min="1" value="4" style="width:80px"></label><button class="pri" onclick="runP()">Calcular</button></div><div id="po"></div></div>`;st('Nuevo');runS();runP()}
const TR={Nuevo:[['Admitir','Preparado']],Preparado:[['Despachar','Ejecución']],Ejecución:[['Fin de quantum','Preparado'],['Pide E/S','Bloqueado'],['Termina','Terminado']],Bloqueado:[['Llega el evento','Preparado']],Terminado:[['Reiniciar','Nuevo']]};
function st(s){$('#stt').innerHTML=Object.keys(TR).map(k=>`<span class="st ${k==s?'on':''}">${k}</span>`).join('→');$('#stb').innerHTML=TR[s].map(t=>`<button onclick="st('${t[1]}')">${t[0]} → ${t[1]}</button>`).join('')}
function runS(){
const ps=$('#ps').value.trim().split('\n').map(l=>l.split(',')).filter(a=>a.length==3).map(a=>({n:a[0].trim(),a:+a[1],b:+a[2],rem:+a[2],f:null,e:null}));
if(!ps.length||ps.some(p=>isNaN(p.a)||isNaN(p.b)||p.b<=0))return $('#so').innerHTML='<p class="card warn">Revisa el formato: nombre,llegada,ejecución (números; ejecución > 0).</p>';
const al=$('#al').value,q=Math.max(1,+$('#qu').value||1),tl=[];let t=0,fin=0;const n=ps.length;
const push=(x,s,e)=>{const l=tl[tl.length-1];if(l&&l.n==x&&l.e==s)l.e=e;else tl.push({n:x,s,e})};
if(al=='RR'){let pend=[...ps].sort((x,y)=>x.a-y.a),qu=[];const adm=()=>{while(pend.length&&pend[0].a<=t)qu.push(pend.shift())};adm();
while(fin<n){if(!qu.length){push('·',t,pend[0].a);t=pend[0].a;adm();continue}const p=qu.shift();if(p.f===null)p.f=t;const r=Math.min(q,p.rem);push(p.n,t,t+r);t+=r;p.rem-=r;adm();if(p.rem>0)qu.push(p);else{p.e=t;fin++}}}
else{while(fin<n){const rd=ps.filter(p=>p.rem>0&&p.a<=t);if(!rd.length){const nx=Math.min(...ps.filter(p=>p.rem>0).map(p=>p.a));push('·',t,nx);t=nx;continue}
const p=al=='SJF'?rd.reduce((x,y)=>y.b<x.b?y:x):rd.reduce((x,y)=>y.a<x.a?y:x);p.f=t;push(p.n,t,t+p.b);t+=p.b;p.rem=0;p.e=t;fin++}}
const tot=tl[tl.length-1].e||1;let sr=0,se=0,ss=0;
const rows=ps.map(p=>{const ret=p.e-p.a,esp=ret-p.b,res=p.f-p.a;sr+=ret;se+=esp;ss+=res;return`<tr><td>${p.n}</td><td>${p.a}</td><td>${p.b}</td><td>${p.e}</td><td>${ret}</td><td>${esp}</td><td>${res}</td></tr>`}).join('');
$('#so').innerHTML=`<div class="g">${tl.map(x=>`<span class="${x.n=='·'?'idle':''}" style="flex:${x.e-x.s}" title="${x.s}–${x.e}">${x.n}</span>`).join('')}</div><p class="sub">Línea de tiempo 0–${tot}</p>
<div class="wrap"><table><tr><th>Proc.</th><th>Llegada</th><th>Ejec.</th><th>Fin</th><th>Retorno</th><th>Espera</th><th>Respuesta</th></tr>${rows}</table></div>
<p>Medias → retorno ${(sr/n).toFixed(2)} · espera ${(se/n).toFixed(2)} · respuesta ${(ss/n).toFixed(2)}</p>`}
function runP(){
const s=+$('#pz').value,p=+$('#pg').value;if(!(s>0&&p>0))return;
const n=Math.ceil(s/p),fi=n*p-s,used=s-(n-1)*p;
$('#po').innerHTML=`<p>${n} páginas de ${p} KB → ${n} marcos (${n*p} KB). Fragmentación interna: <b>${fi} KB</b> (solo en la última página). Fragmentación externa: <b>0</b>.</p><div class="fr">${Array.from({length:n},(_,i)=>`<div style="${i==n-1&&fi?'background:linear-gradient(90deg,#8b5cf655 '+used/p*100+'%,#f8717133 0)':'background:#8b5cf633'}">Pág. ${i+1}</div>`).join('')}</div>`}

// ---------- Diccionario ----------
function gl(q){
q=typeof q=='string'?q:'';
M.innerHTML=`<h2>Diccionario</h2><p><input id="gq" type="search" value="${q.replace(/"/g,'')}" placeholder="Filtrar términos…" style="width:100%" oninput="glf()"></p><div id="gr"></div>`;glf()}
function glf(){
const q=$('#gq').value.toLowerCase();
$('#gr').innerHTML=G.filter(g=>!q||(g[0]+' '+g[2]).toLowerCase().includes(q)).sort((a,b)=>a[0].localeCompare(b[0],'es')).map(g=>`<div class="card def"><b>${g[0]}</b><p style="margin:4px 0">${g[2]}</p><a href="#" style="color:#a78bfa" onclick="tema('${g[1]}');return false">Ver apartado: ${tn(g[1])}</a></div>`).join('')||'<p class="card">Sin resultados.</p>'}
show('home');
</script></body></html>
